# In an epic's tickets/ folder: one table per planned story, spike, or bug

[[entry]]
id = 1
type = "story"
title = "Redesign Sighting Confirmation Modal with Full-Size Circular Accept Button"
description = "Redesigns #sightingModal in index.html and css/style.css as a centered floating modal card where the primary accept button (#btnSightingAwesome, 'Awesome!' / 'Super!') appears first as a 210px circular button matching the size, shape, and orange palette of #btnSpotGiant, followed below by the captured sighting details box (Time, Location, Spotted By) and stacked secondary action buttons (#btnSightingViewMap and #btnSightingUndo), and updates FrontendAssetTest.kt."
verify = "#sightingModal renders as a centered floating card with #btnSightingAwesome first as a 210px circular orange accept button above the sighting details box and stacked View on Map / Undo buttons, and ./gradlew check test spotlessCheck lintJs passes."
covers = ["R43"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Add 20-Second Auto-Close Timer with Progress Outline to Sighting Confirmation Modal Accept Button"
description = "Adds a 20-second automatic dismissal timer to #sightingModal in modal.js paired with an SVG circular progress outline ring around the 210px #btnSightingAwesome button perimeter in index.html and css/style.css that drains clockwise (100% -> 0%) over 20 seconds, auto-closes the modal after 20 seconds, immediately cancels/resets when the user taps Awesome!, View on Map, Undo (keeping the modal open if Undo fails), or opens a new sighting modal, and updates FrontendAssetTest.kt."
verify = "Opening #sightingModal starts a 20-second countdown and clockwise draining SVG outline ring around #btnSightingAwesome that auto-closes on completion and clears cleanly on manual action or re-open, and ./gradlew check test spotlessCheck lintJs passes."
covers = ["R44"]
after = [1, 7]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Tone Down Spot Button Brightness and Glow"
description = "Updates .btn-spot-giant (and #btnSightingAwesome) ready-state styling in css/style.css to use a warmer, toned-down orange/amber gradient and reduced outer box-shadow glow intensity applied identically across both Dark and Light themes for comfortable cabin use while preserving WCAG AA contrast (>= 4.5:1) and clear distinction from muted waiting/no-gps states, and updates FrontendAssetTest.kt."
verify = ".btn-spot-giant and #btnSightingAwesome use the toned-down ready-state orange gradient and reduced box-shadow glow identically in Dark and Light themes while maintaining contrast and disabled-state distinction, and ./gradlew check test spotlessCheck lintJs passes."
covers = ["R45"]
after = [1, 2, 7]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Keep Smartphone Screen Awake via Screen Wake Lock API"
description = "Adds a dedicated /js/wakelock.js module (loaded in index.html) managing navigator.wakeLock.request('screen') on initial page load, re-acquiring on document visibilitychange to 'visible', registering a one-time pointerdown/click fallback if initial load requires a user gesture, and failing silently when unsupported or rejected, and updates FrontendAssetTest.kt."
verify = "/js/wakelock.js is loaded in index.html and requests navigator.wakeLock.request('screen') on load, on visibilitychange === 'visible', and on one-time pointerdown/click fallback with silent error handling, and ./gradlew check test spotlessCheck lintJs passes."
covers = ["R46"]
after = [1, 2, 3, 7, 8]
hitl = false
risk = "low"

