# In an epic's tickets/ folder: one table per planned story, spike, or bug

[[entry]]
id = 1
type = "story"
title = "Replace SQLite with Embedded H2 Database and Native Timestamps"
description = "Replaces sqlite-jdbc with quarkus-jdbc-h2 (MODE=MySQL), migrates Flyway DDL to ANSI/MySQL with native TIMESTAMP(3) columns, and removes ReentrantLock thread serialization from SightingRepository."
verify = "Quarkus boots cleanly with H2, Flyway executes V1 DDL with TIMESTAMP(3), SightingRepository performs concurrent CRUD operations without in-memory locks, and all tests pass."
covers = ["R23"]
after = []
hitl = false
risk = "low"

