# In an epic's tickets/ folder: one table per planned story, spike, or bug

[[entry]]
id = 1
type = "story"
title = "Replace SQLite with Embedded H2 Database and Native Timestamps"
description = "Replaces sqlite-jdbc with quarkus-jdbc-h2 (MODE=MySQL), migrates Flyway DDL to ANSI/MySQL with VARCHAR(255) user_id and native TIMESTAMP(3) columns, removes ReentrantLock thread serialization from SightingRepository while keeping @Startup @PostConstruct fail-fast SELECT 1 validation, and replaces org.sqlite.* imports with java.sql.SQLException so the build compiles cleanly."
verify = "Quarkus boots cleanly with H2, Flyway executes V1 DDL with TIMESTAMP(3), SightingRepository performs concurrent CRUD operations without in-memory locks, zero org.sqlite references remain, and ./gradlew check test passes."
covers = ["R23"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Unified SQLState Contention ExceptionMapper and Dynamic Health Reporting"
description = "Replaces SQLiteExceptionMapper with DatabaseContentionExceptionMapper translating ANSI SQLStates (40001, 40P01, 57P01, HYT00) and H2/MariaDB lock error codes across causal SQLException chains to RFC 7807 503, and updates DatabaseHealthCheck to report live databaseProductName under 'Database connection health check'."
verify = "Simulated lock contention (including wrapped SQLException and MariaDB/H2 vendor codes) returns HTTP 503 with Retry-After: 1 header, and /q/health/ready dynamically reports databaseProductName."
covers = ["R24", "R25"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Configurable Multi-Target Datasource (MySQL or H2 File)"
description = "Bundles quarkus-jdbc-mariadb alongside quarkus-jdbc-h2 with automatic startup driver routing from the single QUARKUS_DATASOURCE_JDBC_URL string (jdbc:h2:file:... vs jdbc:mariadb://...), updates Dockerfile and docker-compose.yml default JDBC URLs from SQLite to H2 file, and documents datasource configuration in README.md."
verify = "Application switches datasource driver automatically at startup based solely on QUARKUS_DATASOURCE_JDBC_URL (H2 file vs MariaDB/MySQL), Dockerfile and docker-compose.yml use H2 file URLs, and README.md documents single-URL configuration."
