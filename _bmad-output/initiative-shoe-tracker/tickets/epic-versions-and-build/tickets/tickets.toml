# In an epic's tickets/ folder: one table per planned story, spike, or bug

[[entry]]
id = 1
type = "story"
title = "Fully Move to JDK 25 for Local Development, Build Toolchain, and GitHub Actions CI Workflow"
description = "Upgrades build.gradle.kts (JavaVersion.VERSION_25, vendor-agnostic JavaLanguageVersion.of(25) toolchain, and Kotlin JvmTarget.JVM_25), updates .github/workflows/ci.yml ('- name: Set up JDK 25' and java-version: '25' with distribution: 'temurin'), updates README.md ('Java 25' and 'JDK 25'), and adds JDK 25 assertions (and absence of JDK 21) for ci.yml, build.gradle.kts, and README.md in DevOpsAssetTest.kt."
verify = "build.gradle.kts compiles and runs tests on JDK 25 with zero VERSION_21/JVM_21 references, .github/workflows/ci.yml configures 'Set up JDK 25' and java-version: '25' with zero JDK 21 references, README.md specifies JDK 25, and ./gradlew check test passes."
covers = ["R36"]
after = []
hitl = false
risk = "low"

