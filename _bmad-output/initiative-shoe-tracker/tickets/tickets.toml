# In an initiative's tickets/ folder: one table per epic

[[epic]]
id = 1
slug = "epic-core-capture"
title = "Container Scaffold & Core Sighting Capture"
description = "Smartphone user sets name and taps big button to record sighting with hot GPS coordinates and cooldown into SQLite via Quarkus REST API in a single container."
covers = ["R1", "R2", "R6", "R7", "R9"]

[[epic]]
id = 2
slug = "epic-views-and-map"
title = "Sighting Exploration (Map & List Views)"
description = "User explores sightings on Leaflet map and chronological list with distinct styling for own shoes and filter toggle, plus live location map above spot button."
covers = ["R4", "R5", "R8"]
after = [{ epic = "epic-core-capture", needs = "Sightings query API and shared sighting schema" }]

[[epic]]
id = 3
slug = "epic-spotting-polish"
title = "Spotting UX Polish & German Localization"
description = "Streamlines the road-trip spotting and exploration flow with light/dark theme toggle, German localization ('SCHUH!'), nearby shoes rendered on the mini-map, zoom-based map marker clustering with count badges, jump-to-map action from list entries, reactive global and personal sighting counters, and removing the 3s cooldown in favor of the confirmation modal."
covers = ["R28", "R29", "R30", "R31", "R32", "R33", "R34", "R35"]
after = [{ epic = "epic-views-and-map", needs = "Mini-map and exploration views" }]

[[epic]]
id = 4
slug = "epic-open-source-devops"
title = "Open Source Licensing & CI/CD Publication"
description = "Adopts GNU AGPL-3.0 copyleft license, establishes GitHub Actions workflow for automated test verification, and publishes multi-stage container images to Docker Hub."
covers = []
after = [{ epic = "epic-views-and-map", needs = "Sightings views and verified test suite" }]

[[epic]]
id = 5
slug = "epic-architecture-resilience"
title = "Architecture Hardening & Offline Resilience"
description = "Hardens system resilience with global RFC 7807 500 error mappers with UUID correlation, eager @PostConstruct prepared statements and fail-fast startup, SQLite lock error translation to 503, and SmallRye health probes."
covers = ["R18", "R19", "R20", "R21", "R22"]
after = [{ epic = "epic-open-source-devops", needs = "CI pipeline and licensing" }]

[[epic]]
id = 6
slug = "epic-database-modernization"
title = "Database Modernization & GraalVM Native Image"
description = "Replaces SQLite with pure-Java embedded H2 database (MODE=MySQL) with native TIMESTAMP(3), enables startup switching between embedded H2 file and external MariaDB/MySQL from a single JDBC URL string, and compiles standalone GraalVM native binary."
covers = ["R23", "R24", "R25", "R26", "R27"]
after = [{ epic = "epic-architecture-resilience", needs = "Hardened architecture and offline vendoring" }]

[[epic]]
id = 7
slug = "epic-versions-and-build"
title = "Build Toolchain Modernization, CI/CD Upgrades & UI Polish"
description = "Upgrades Gradle toolchain, Kotlin bytecode target, and CI to JDK 25; migrates GitHub Actions to v5 (Node 24); streamlines Docker Hub container builds to linux/amd64 without QEMU overhead; updates Docker Hub image references to mithomas/shoe-tracker; updates GPS unavailable overlay/labels to No GPS / Kein GPS; and fixes MariaDB 11.8 Flyway support, JDK 25 JNA native access warnings, and Agroal exception sorter configuration for db-kind=other."
covers = ["R36", "R37", "R38", "R39", "R40", "R41", "R42"]
after = [{ epic = "epic-database-modernization", needs = "Modernized build and CI asset test suite" }]

[[epic]]
id = 8
slug = "epic-cabin-ux-and-modal-redesign"
title = "Cabin Ergonomics, Map Decluttering & Sighting Modal Redesign"
description = "Redesigns the Sighting Confirmation Modal with a full-size 210px circular accept button aligned with the Spot button and a 20-second auto-close progress outline ring, tones down Spot button brightness/glow for night driving, keeps smartphone screens awake via the Screen Wake Lock API, and removes the 'HUD Radar' mini-map badge and full-map empty-state overlay banners."
covers = ["R43", "R44", "R45", "R46", "R47", "R48"]
after = []

[[epic]]
id = 9
slug = "epic-mock-gps-and-testing-docs"
title = "Simulated GPS Custom Coordinates & Testing Documentation"
description = "Extends mock GPS mode in geo.js to accept stationary, non-persisted custom coordinates via ?mockGps=<lat>,<lon> and cleanly exit persisted mock mode via ?mockGps=false, and documents mock GPS local testing in README.md."
covers = ["R49", "R50"]
after = []
