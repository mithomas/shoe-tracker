[[entry]]
id = 1
type = "story"
title = "Extend Mock GPS Mode with Optional Custom Coordinate Parameters"
description = "Extends GeolocationWatcher in js/geo.js to parse compact ?mockGps=<lat>,<lon> URL parameters (validating finite lat in [-90, 90] and lon in [-180, 180]), keep custom coordinates stationary without simulated movement and without persisting to localStorage, support optional (lat, lon) arguments on enableMockMode(lat, lon), clear persisted mock state on ?mockGps=false, and adds verification tests in FrontendAssetTest.kt."
