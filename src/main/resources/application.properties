# HTTP Server
quarkus.http.port=8080

# SQLite Datasource via Agroal
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:./data/shoe-tracker.db?journal_mode=WAL&busy_timeout=5000
quarkus.datasource.jdbc.init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5

# Flyway Database Migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# JSON Formatting
quarkus.jackson.write-dates-as-timestamps=false

# Test Profile
%test.quarkus.http.test-port=0
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:./data/shoe-tracker-test.db?journal_mode=WAL&busy_timeout=5000
