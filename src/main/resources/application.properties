# HTTP Server
quarkus.http.port=8080

# Multi-Target Datasource via Agroal (H2 file default or MariaDB/MySQL via QUARKUS_DATASOURCE_JDBC_URL)
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.shoetracker.repository.MultiTargetJdbcDriver
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/shoe-tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
quarkus.datasource.jdbc.enable-stm-cache=true
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5

# Flyway Database Migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# JSON Formatting
quarkus.jackson.write-dates-as-timestamps=false

# GraalVM Native Image Configuration
quarkus.native.resources.includes=version.properties,db/migration/**
quarkus.native.additional-build-args=--initialize-at-run-time=org.shoetracker.domain.UUIDv7

# Test Profile
%test.quarkus.http.test-port=0
%test.quarkus.datasource.jdbc.url=jdbc:h2:file:./build/test-data/shoe-tracker-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
